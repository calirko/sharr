services:
  # Web build + API. The single Nginx Proxy Manager entry (sharr.calirko.com) points here.
  # Not named "app": service names become DNS names on dragon, and calirko.com's app already uses that.
  sharr:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: sharr-app
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=America/Sao_Paulo
      - REDIS_URL=redis://db:6379
      - LIVEKIT_API_URL=http://sharr-livekit:7880
      - RELAY_URL=ws://sharr-relay:7890
    depends_on:
      - db
    networks:
      default:
      dragon:
        aliases:
          - sharr
    restart: unless-stopped

  # SFU. NPM only proxies its websocket signaling (custom location /rtc -> sharr-livekit:7880).
  # Media (UDP/TCP) can't go through NPM, so those ports are published on the host.
  livekit:
    image: livekit/livekit-server:latest
    container_name: sharr-livekit
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    configs:
      - source: livekit
        target: /etc/livekit.yaml
    ports:
      - "7881:7881/tcp"    # ICE/TCP fallback
      - "7882:7882/udp"    # ICE/UDP, all media on one port
      - "3478:3478/udp"    # TURN/UDP
    networks:
      dragon:
        aliases:
          - sharr-livekit
    restart: unless-stopped

  # Discord Activity test: forwards share video to Activity viewers over a websocket (through app).
  # Joins rooms as a hidden participant, talks to LiveKit over dragon.
  sharr-relay:
    build:
      context: apps/relay
    container_name: sharr-relay
    environment:
      - LIVEKIT_WS_URL=ws://sharr-livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    networks:
      dragon:
        aliases:
          - sharr-relay
    restart: unless-stopped

  # Private: only reachable by app over the stack's default network.
  db:
    image: redis:7-alpine
    container_name: sharr-db
    command: redis-server --appendonly yes
    volumes:
      - sharr_data:/data
    restart: unless-stopped

# Inline so it doesn't depend on repo files being on disk at deploy time (Dokploy).
configs:
  livekit:
    content: |
      port: 7880
      rtc:
        tcp_port: 7881
        udp_port: 7882        # single-port UDP mux; port_range_* is ignored when set
        use_external_ip: true # advertise the server's public IP to clients behind NAT
      turn:
        enabled: true
        udp_port: 3478
        # TURN/TLS needs its own hostname (not behind NPM); add later if UDP is blocked for some clients.

volumes:
  sharr_data:
    name: sharr_data

networks:
  dragon:
    external: true
