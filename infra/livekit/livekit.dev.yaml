# Local dev only: clients run on this machine, so don't advertise the public IP.
# No node_ip: LiveKit advertises its container IPs, which the host can reach.
# Don't pin 127.0.0.1, Firefox skips loopback ICE candidates and never connects.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
turn:
  enabled: false
