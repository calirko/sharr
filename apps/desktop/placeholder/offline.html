<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sharr</title>
<style>
  :root {
    --bg: #fff; --fg: #252525; --muted: #8e8e8e; --border: #ebebeb; --hover: rgba(37,37,37,.1);
    --primary: #262626; --primary-fg: #fafafa; --destructive: #e7000b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #252525; --fg: #fafafa; --muted: #a1a1a1; --border: rgba(255,255,255,.1); --hover: rgba(250,250,250,.1);
      --primary: #e5e5e5; --primary-fg: #343434;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
    font: 14px/1.5 Inter, system-ui, sans-serif; user-select: none;
  }
  header { height: 2.25rem; display: flex; align-items: center; padding-left: .75rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  header .name { margin-left: .5rem; font-weight: 700; letter-spacing: -.02em; font-family: "Space Grotesk", Inter, system-ui, sans-serif; }
  .controls { margin-left: auto; display: flex; height: 100%; }
  .controls button {
    width: 2.75rem; border: 0; background: none; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: default;
  }
  .controls button:hover { background: var(--hover); color: var(--fg); }
  .controls button.close:hover { background: var(--destructive); color: #fff; }
  .controls svg { width: 14px; height: 14px; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem; padding: 1rem; text-align: center; }
  h1 { font: 700 1.25rem "Space Grotesk", Inter, system-ui, sans-serif; letter-spacing: -.02em; }
  p { color: var(--muted); }
  .retry {
    margin-top: .75rem; height: 2.25rem; padding: 0 1rem; border: 0; border-radius: .5rem;
    background: var(--primary); color: var(--primary-fg); font: 500 14px Inter, system-ui, sans-serif;
  }
  .retry:disabled { opacity: .5; }
</style>
</head>
<body>
<header data-tauri-drag-region>
  <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" rx="7" fill="#262626"/>
    <g transform="translate(6 6) scale(0.8333)" fill="none" stroke="#f5f5f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 10 3-3 3 3"/><path d="M12 13V7"/><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
    </g>
  </svg>
  <span class="name" data-tauri-drag-region>sharr</span>
  <div class="controls">
    <button data-cmd="minimize" title="Minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button data-cmd="toggle_maximize" title="Maximize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
    <button data-cmd="close" class="close" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
</header>
<main>
  <h1>Can't reach sharr</h1>
  <p>Check your connection, or the server may be down.</p>
  <p id="status">Trying again in a few seconds.</p>
  <button class="retry" id="retry">Retry</button>
</main>
<script>
  const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
  for (const b of document.querySelectorAll("[data-cmd]")) {
    b.onclick = () => invoke("plugin:window|" + b.dataset.cmd).catch(() => {});
  }
  const button = document.getElementById("retry");
  const status = document.getElementById("status");
  let timer;
  async function retry() {
    clearTimeout(timer);
    button.disabled = true;
    status.textContent = "Connecting...";
    const up = await invoke("offline_retry").catch(() => false);
    if (up) return;
    button.disabled = false;
    status.textContent = "Trying again in a few seconds.";
    timer = setTimeout(retry, 5000);
  }
  button.onclick = retry;
  timer = setTimeout(retry, 5000);
</script>
</body>
</html>
