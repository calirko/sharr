[package]
name = "sharr"
version = "0.1.16"
edition = "2021"
publish = false

[lib]
name = "sharr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
# Tauri 3 alpha for its CEF runtime: WebKitGTK ships without WebRTC, so the web app can't run on it
tauri = { version = "=3.0.0-alpha.5", features = [] }
tauri-runtime-cef = "=3.0.0-alpha.6"
tauri-plugin-updater = "=3.0.0-alpha.3"
tauri-plugin-opener = "=3.0.0-alpha.3"
# Native notifications (D-Bus, WinRT toasts) instead of Chromium's own popups
tauri-plugin-notification = "=3.0.0-alpha.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
interprocess = "2.4"
tokio = { version = "1", features = ["time", "net", "io-util"] }
getrandom = "0.3"
# Health check for the offline page, same client and TLS as the updater
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-core = "0.62"
# Picker thumbnails
jpeg-encoder = "0.7"
base64 = "0.22"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10"
glib-sys = "0.22"
libc = "0.2"

# The runtime with one change: an Allow from the permission handler also grants desktop
# capture, which upstream always leaves to Chromium's picker. See picker.rs.
# Copied from the crates.io release, keep the version in step with the dependency above.
[patch.crates-io]
tauri-runtime-cef = { path = "vendor/tauri-runtime-cef" }

# No LTO: it barely changes the size next to Chromium and makes release builds much slower
[profile.release]
strip = true
