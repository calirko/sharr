[package]
name = "sharr"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "sharr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
# Tauri 3 alpha for its CEF runtime: WebKitGTK ships without WebRTC, so the web app can't run on it
tauri = { version = "=3.0.0-alpha.5", features = [] }
tauri-runtime-cef = "=3.0.0-alpha.6"
tauri-plugin-updater = "=3.0.0-alpha.3"
tauri-plugin-opener = "=3.0.0-alpha.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
